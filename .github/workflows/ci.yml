name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: lint, test, extension, installer, launcher (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sapid
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get install -y shellcheck jq
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: test/check.sh

  deny:
    name: cargo deny (advisories, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: sapid/Cargo.toml

  smoke:
    name: real Docker on Ubuntu
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sapid
      - run: sudo apt-get install -y jq
      - run: test/smoke.sh

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,       target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm,    target: aarch64-unknown-linux-musl }
          - { os: macos-13,            target: x86_64-apple-darwin }
          - { os: macos-latest,        target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sapid
          key: ${{ matrix.target }}
      - run: cd sapid && cargo build --release --locked --target ${{ matrix.target }}
      - run: sapid/target/${{ matrix.target }}/release/sapid --version
