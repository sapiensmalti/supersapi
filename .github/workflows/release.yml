name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,       target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm,    target: aarch64-unknown-linux-musl }
          - { os: macos-latest,        target: x86_64-apple-darwin }   # cross-linked on arm64; Intel runners are retired
          - { os: macos-latest,        target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cd sapid && cargo build --release --locked --target ${{ matrix.target }}
      - run: scripts/package.sh ${{ matrix.target }} sapid/target/${{ matrix.target }}/release/sapid dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: verify archives install
        run: |
          t=x86_64-unknown-linux-musl
          SUPERSAPI_ASSET_DIR="$PWD/dist" SUPERSAPI_INSTALL_DIR=/tmp/bin SUPERSAPI_HOME=/tmp/home bash install.sh
          /tmp/bin/sapid --version && /tmp/bin/supersapi version
          echo "target $t verified"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* --title "supersapi $tag" --verify-tag --generate-notes
